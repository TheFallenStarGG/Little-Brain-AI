openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Local username and password account operations
  - name: brain
    description: Bigram model and conversation operations
  - name: chats
    description: Private and group chat operations
  - name: admin
    description: Administrator-only account and AI conversation operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Get the current local account session
      responses:
        "200":
          description: Current account session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create a local username and password account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "200":
          description: Created account session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid account details
        "409":
          description: Username already exists
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in to a local account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "200":
          description: Account session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid account details
        "401":
          description: Invalid username or password
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out of the current local account
      responses:
        "200":
          description: Signed-out session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /brain/overview:
    get:
      operationId: getBrainOverview
      tags: [brain]
      summary: Get the current model overview
      responses:
        "200":
          description: Current model statistics and backup state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrainOverview"
  /brain/messages:
    get:
      operationId: getBrainMessages
      tags: [brain]
      summary: Get conversation messages
      responses:
        "200":
          description: Conversation history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
  /brain/chat:
    post:
      operationId: sendBrainMessage
      tags: [brain]
      summary: Learn from a message and generate a response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInput"
      responses:
        "200":
          description: The new messages and updated model overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResult"
        "400":
          description: Invalid message
  /brain/snapshots:
    get:
      operationId: getBrainSnapshots
      tags: [brain]
      summary: List model snapshots
      responses:
        "200":
          description: Saved snapshot history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModelSnapshot"
    post:
      operationId: createBrainSnapshot
      tags: [brain]
      summary: Save a model snapshot
      responses:
        "201":
          description: Created snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelSnapshot"
  /brain/github:
    get:
      operationId: getBrainGithub
      tags: [brain]
      summary: Get GitHub snapshot settings
      responses:
        "200":
          description: GitHub settings and connection state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubSettings"
    put:
      operationId: updateBrainGithub
      tags: [brain]
      summary: Update GitHub snapshot settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GithubSettingsInput"
      responses:
        "200":
          description: Updated GitHub settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubSettings"
  /chats:
    get:
      operationId: getChats
      tags: [chats]
      summary: List private and group chats for the signed-in account
      responses:
        "200":
          description: Chat summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatSummary"
    post:
      operationId: createChat
      tags: [chats]
      summary: Create a private or group chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChatInput"
      responses:
        "201":
          description: Created chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatDetail"
        "400":
          description: Invalid chat details
        "404":
          description: Participant account not found
  /chats/{chatId}:
    get:
      operationId: getChat
      tags: [chats]
      summary: Get a private or group chat
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Chat detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatDetail"
        "404":
          description: Chat not found
    patch:
      operationId: renameChat
      tags: [chats]
      summary: Rename a group chat as its owner
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameChatInput"
      responses:
        "200":
          description: Renamed chat detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatDetail"
        "400":
          description: Invalid chat name or unsupported chat type
        "403":
          description: Only the group owner can rename this chat
        "404":
          description: Chat not found
  /chats/{chatId}/messages:
    post:
      operationId: sendChatMessage
      tags: [chats]
      summary: Send a message to a private or group chat
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendChatMessageInput"
      responses:
        "200":
          description: Updated chat detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatDetail"
        "400":
          description: Invalid message
        "404":
          description: Chat not found
  /admin/accounts:
    get:
      operationId: getAdminAccounts
      tags: [admin]
      summary: List accounts for administrators
      responses:
        "200":
          description: Account status list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAccount"
  /admin/words:
    get:
      operationId: getAdminWords
      tags: [admin]
      summary: List words learned by the model
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: Learned vocabulary with teaching attribution
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminLearnedWord"
  /admin/words/{word}:
    delete:
      operationId: deleteAdminWord
      tags: [admin]
      summary: Delete a learned word and its model connections
      parameters:
        - name: word
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted learned word
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWordDeletion"
        "400":
          description: Invalid learned word
        "404":
          description: Learned word not found
  /admin/chats:
    get:
      operationId: getAdminChats
      tags: [admin]
      summary: List AI-involving chats for administrators
      responses:
        "200":
          description: AI conversation summaries only
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminChatSummary"
  /admin/chats/{chatId}:
    get:
      operationId: getAdminChat
      tags: [admin]
      summary: Get an AI-involving chat for administrators
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: AI conversation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminChatDetail"
        "404":
          description: AI conversation not found
  /admin/accounts/{username}/ban:
    post:
      operationId: banAdminAccount
      tags: [admin]
      summary: Ban an account and delete its saved chat history
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Banned account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccount"
        "403":
          description: Self-ban or administrator-ban rejected
        "404":
          description: Account not found
  /admin/admins:
    post:
      operationId: grantAdmin
      tags: [admin]
      summary: Grant administrator access to an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminGrantAdminInput"
      responses:
        "200":
          description: Account with administrator access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccount"
        "400":
          description: Invalid username
        "404":
          description: Account not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthSession:
      type: object
      required: [authenticated, username, isAdmin]
      properties:
        authenticated:
          type: boolean
        username:
          type: ["string", "null"]
        isAdmin:
          type: boolean
        message:
          type: string
    AccountInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[A-Za-z0-9_-]+$"
        password:
          type: string
          minLength: 8
          maxLength: 128
    ChatMessage:
      type: object
      required: [id, role, content, createdAt]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        createdAt:
          type: string
    ChatInput:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 2000
    BrainOverview:
      type: object
      required: [vocabulary, bigrams, messages, learningStartedAt, lastSnapshotAt, nextSnapshotAt, githubConfigured, githubConnected]
      properties:
        vocabulary:
          type: number
          minimum: 0
        bigrams:
          type: number
          minimum: 0
        messages:
          type: number
          minimum: 0
        learningStartedAt:
          type: string
        lastSnapshotAt:
          type: ["string", "null"]
        nextSnapshotAt:
          type: string
        githubConfigured:
          type: boolean
        githubConnected:
          type: boolean
    ChatResult:
      type: object
      required: [userMessage, assistantMessage, overview]
      properties:
        userMessage:
          $ref: "#/components/schemas/ChatMessage"
        assistantMessage:
          $ref: "#/components/schemas/ChatMessage"
        overview:
          $ref: "#/components/schemas/BrainOverview"
    ModelSnapshot:
      type: object
      required: [id, filename, createdAt, vocabulary, bigrams, messages, status]
      properties:
        id:
          type: string
        filename:
          type: string
        createdAt:
          type: string
        vocabulary:
          type: number
          minimum: 0
        bigrams:
          type: number
          minimum: 0
        messages:
          type: number
          minimum: 0
        status:
          type: string
          enum: [local, github, failed]
        error:
          type: ["string", "null"]
    GithubSettings:
      type: object
      required: [owner, repository, branch, configured, connected]
      properties:
        owner:
          type: string
        repository:
          type: string
        branch:
          type: string
        configured:
          type: boolean
        connected:
          type: boolean
        message:
          type: string
    GithubSettingsInput:
      type: object
      required: [owner, repository, branch]
      properties:
        owner:
          type: string
          maxLength: 100
        repository:
          type: string
          maxLength: 100
        branch:
          type: string
          maxLength: 100
    ChatParticipant:
      type: object
      required: [username, displayName, isBrain]
      properties:
        username:
          type: string
        displayName:
          type: string
        isBrain:
          type: boolean
    PrivateChatMessage:
      type: object
      required: [id, sender, content, createdAt]
      properties:
        id:
          type: string
        sender:
          $ref: "#/components/schemas/ChatParticipant"
        content:
          type: string
        createdAt:
          type: string
    ChatSummary:
      type: object
      required: [id, type, title, ownerUsername, participants, includeBrain, createdAt, updatedAt, lastMessage]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [private, group]
        title:
          type: string
        ownerUsername:
          type: string
        participants:
          type: array
          items:
            $ref: "#/components/schemas/ChatParticipant"
        includeBrain:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
        lastMessage:
          oneOf:
            - $ref: "#/components/schemas/PrivateChatMessage"
            - type: "null"
    ChatDetail:
      allOf:
        - $ref: "#/components/schemas/ChatSummary"
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/PrivateChatMessage"
    CreateChatInput:
      type: object
      required: [type, participantUsernames, includeBrain]
      properties:
        type:
          type: string
          enum: [private, group]
        participantUsernames:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 3
            maxLength: 32
            pattern: "^[A-Za-z0-9_-]+$"
        includeBrain:
          type: boolean
    SendChatMessageInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000
    RenameChatInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
    AdminAccount:
      type: object
      required: [username, createdAt, isAdmin, isBanned]
      properties:
        username:
          type: string
        createdAt:
          type: string
        isAdmin:
          type: boolean
        isBanned:
          type: boolean
    AdminChatMessage:
      type: object
      required: [id, sender, content, createdAt]
      properties:
        id:
          type: string
        sender:
          $ref: "#/components/schemas/ChatParticipant"
        content:
          type: string
        createdAt:
          type: string
    AdminChatSummary:
      type: object
      required: [id, type, title, participants, includeBrain, createdAt, updatedAt, lastMessage]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [direct, group]
        title:
          type: string
        participants:
          type: array
          items:
            $ref: "#/components/schemas/ChatParticipant"
        includeBrain:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
        lastMessage:
          oneOf:
            - $ref: "#/components/schemas/AdminChatMessage"
            - type: "null"
    AdminChatDetail:
      allOf:
        - $ref: "#/components/schemas/AdminChatSummary"
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/AdminChatMessage"
    AdminGrantAdminInput:
      type: object
      required: [username]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[A-Za-z0-9_-]+$"
    AdminLearnedWordTeacher:
      type: object
      required: [username, count]
      properties:
        username:
          type: string
        count:
          type: number
          minimum: 0
    AdminLearnedWord:
      type: object
      required: [word, count, taughtBy]
      properties:
        word:
          type: string
        count:
          type: number
          minimum: 0
        taughtBy:
          type: array
          items:
            $ref: "#/components/schemas/AdminLearnedWordTeacher"
    AdminWordDeletion:
      type: object
      required: [word, deleted, remainingWords]
      properties:
        word:
          type: string
        deleted:
          type: boolean
        remainingWords:
          type: number
          minimum: 0

